# nginx/conf.d/nexus.conf

# Header Connection: kosong untuk request biasa (keep-alive ke upstream tetap hidup),
# "upgrade" hanya bila klien memang meminta Upgrade (mis. WebSocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream nexus_app {
    server nexus-iot:5000;
    keepalive 16;
    # Tutup koneksi idle lebih dulu daripada Gunicorn (--keep-alive 5) agar tidak
    # ada race "koneksi baru saja ditutup upstream".
    keepalive_timeout 3s;
}

server {
    listen 80;
    server_name _ localhost;

    access_log /var/log/nginx/nexus-access.log main;
    error_log /var/log/nginx/nexus-error.log warn;

    location /static/ {
        alias /static/;
        # Cache: file statik WAJIB berganti nama/hash bila isinya berubah
        # (immutable 30d). Naikkan versi di template bila rename manual.
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # ✅ P1-A FIX: /health di-proxy ke Flask supaya security headers
    # dari Flask ikut terkirim. Sebelumnya di-short-circuit oleh Nginx.
    location = /health {
        proxy_pass http://nexus_app/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # H5: chat AI memanggil LLM (LLM_TIMEOUT default 120 dtk, bisa beberapa putaran).
    # Read timeout >= LLM_TIMEOUT x 1,5. Jika LLM_TIMEOUT dinaikkan, naikkan juga nilai ini.
    location /api/v1/chat {
        proxy_pass http://nexus_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Jangan menahan respons chat di buffer Nginx
        proxy_buffering off;
    }

    location / {
        proxy_pass http://nexus_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 65s; # > Gunicorn --timeout 60 agar Nginx tidak
        proxy_read_timeout 65s; # memotong duluan sebelum worker menyerah

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

