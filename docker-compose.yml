services:
  nexus-iot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-iot
    restart: unless-stopped
    expose:
      - "${PORT:-5000}"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./backup:/app/backup
    env_file:
      - path: .env
        required: false
      # Kode aplikasi ada di dalam image (rebuild: docker compose up -d --build).
      # Mount kode untuk development ada di docker-compose.override.yml.
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - PYTHONUNBUFFERED=1
      - PORT=${PORT:-5000}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    networks:
      - nexus-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${PORT:-5000}/health', timeout=5).status == 200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-4455}:80"
      # TLS: aktifkan setelah sertifikat di-mount ke /etc/nginx/certs dan
      # blok `listen 443 ssl` di nginx/conf.d/nexus.conf di-uncomment
      # (HTTP :80 lalu di-redirect ke HTTPS :443 di sana).
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/static:ro
      # TLS: uncomment bersama blok `listen 443 ssl` di nginx/conf.d/nexus.conf.
      # Taruh cert di ./certs/ {fullchain.pem, privkey.pem}, lalu recreate nginx.
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      nexus-iot:
        condition: service_healthy
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nexus-network:
    driver: bridge