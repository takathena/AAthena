<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="theme-color" content="#0a0a0a">
    <title>{% block title %}NEXUS IoT{% endblock %}</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
    <style>.skip-link{position:absolute;left:-9999px;top:0;background:#fff;color:#000;padding:8px 14px;z-index:9999;border-radius:0 0 8px 0}.skip-link:focus{left:0}</style>

    {% block extra_css %}{% endblock %}

    <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Lewati ke konten utama</a>
    <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
    </main>

    {% block app_scripts %}
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard_store.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
    {% endblock %}
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
    <script src="{{ url_for('static', filename='js/error-handler.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
